# Cloudflare Pages Configuration for FindCollege.ai Course Platform
name = "findcollege-courses"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# NOTE: For Cloudflare Pages, bind D1 and R2 directly in the Cloudflare Dashboard:
# Project > Settings > Functions > D1 Database Bindings (Name: DB)
# Project > Settings > Functions > R2 Bucket Bindings (Name: BUCKET)
# (Avoids invalid placeholder UUID errors during deployment)

[vars]
COMPANY_NAME = "FINDCOLLEGE.AI"
SUPPORT_EMAIL = "support@findcollege.ai"
CURRENCY = "INR"
EMAIL_FROM = "FindCollege.ai <courses@findcollege.ai>"
ADMIN_PASSWORD = "FindCollege#2026"
